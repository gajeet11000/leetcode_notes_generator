[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leetnotes-cli"
version = "0.1.0"
description = "Command-line interface for LeetCode notes generator"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Gajeet" },
]
keywords = ["leetcode", "notes", "obsidian", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development",
]
dependencies = [
    "leetnotes-core",
    "click>=8.4.2",
    "inquirerpy>=0.3.4",
]

[project.scripts]
leetnotes = "leetnotes_cli.main:main"
leetcode-notes = "leetnotes_cli.main:main"

[tool.uv.sources]
leetnotes-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/leetnotes_cli"]
