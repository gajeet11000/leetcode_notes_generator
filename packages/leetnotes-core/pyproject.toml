[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leetnotes-core"
version = "0.1.0"
description = "Core engine for LeetCode problem synchronization and note rendering"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "G Ajeet" },
]
keywords = ["leetcode", "notes", "dsa", "algorithms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "bs4>=0.0.2",
    "jinja2>=3.1.6",
    "markdownify>=1.2.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "requests-ratelimiter>=0.10.0",
    "structlog>=26.1.0",
    "urllib3>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leetnotes_core"]
