[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leetcode-notes-generator"
version = "0.1.0"
description = "Sync solved LeetCode problems and generate structured study notes for Obsidian or Markdown"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Gajeet" },
]
keywords = ["leetcode", "notes", "obsidian", "dsa", "algorithms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development",
]
dependencies = [
    "bs4>=0.0.2",
    "click>=8.4.2",
    "inquirerpy>=0.3.4",
    "jinja2>=3.1.6",
    "markdownify>=1.2.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "requests-ratelimiter>=0.10.0",
    "structlog>=26.1.0",
    "urllib3>=2.7.0",
]

[project.scripts]
leetnotes = "leetnotes.cli.main:main"
leetcode-notes = "leetnotes.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leetnotes"]
