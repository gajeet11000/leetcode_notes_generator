[project]
name = "leetcode-notes-monorepo"
version = "0.1.0"
description = "Monorepo workspace for leetnotes (core and CLI)"
requires-python = ">=3.14"
dependencies = [
    "leetnotes-cli",
]

[tool.uv]
package = false

[tool.uv.sources]
leetnotes-cli = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.5",
]
